{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.redis.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tech-radar.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.redis.name }}
    app.kubernetes.io/component: {{ .Values.redis.component }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.redis.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.redis.name }}
        app.kubernetes.io/component: {{ .Values.redis.component }}
    spec:
      securityContext:
        {{- include "tech-radar.podSecurityContext" .Values.redis.securityContext | nindent 8 }}
      containers:
        - name: redis
          image: {{ include "tech-radar.image" (dict "image" .Values.redis.image "root" $) }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "tech-radar.containerSecurityContext" (dict "root" $ "bilesen" .Values.redis) | nindent 12 }}
          ports:
            - containerPort: {{ .Values.redis.port }}
          # Tirnak sart: tirnaksiz `yes` YAML'da boolean olur ve Kubernetes
          # Deployment'i reddeder (1.0.0'daki hata; kubeconform yakaladi)
          command:
            - redis-server
            - --appendonly
            - {{ .Values.redis.appendonly | ternary "yes" "no" | quote }}
            - --maxmemory
            - {{ .Values.redis.maxmemory | quote }}
            - --maxmemory-policy
            - {{ .Values.redis.maxmemoryPolicy | quote }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: {{ .Values.redis.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.redis.probes.readiness.periodSeconds }}
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: {{ .Values.redis.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.redis.probes.liveness.periodSeconds }}
      volumes:
        # Kabul edilen sinir (spec 12): kilit/soguma/cache/kuyruk pod omru kadar
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tech-radar.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.redis.name }}
    app.kubernetes.io/component: {{ .Values.redis.component }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
  selector:
    app.kubernetes.io/name: {{ .Values.redis.name }}
{{- end }}
