apiVersion: v1
kind: Secret
metadata:
  name: teknoloji-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tech-radar.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.secretKey zorunlu (openssl rand -hex 32)" .Values.secrets.secretKey | quote }}
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  # PostgreSQL konteyneri de POSTGRES_PASSWORD'unu bu anahtardan okur: tek parola
  DB_PASSWORD: {{ required "secrets.dbPassword zorunlu (openssl rand -hex 24); PostgreSQL ve uygulama ayni parolayi kullanir" .Values.secrets.dbPassword | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
