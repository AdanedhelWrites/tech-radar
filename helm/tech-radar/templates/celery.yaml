        {{- include "tech-radar.ayarOzeti" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "tech-radar.podSecurityContext" .Values.scheduler.securityContext | nindent 8 }}
      initContainers:
        {{- include "tech-radar.migrasyonBekle" . | nindent 8 }}
      containers:
        - name: scheduler
          image: {{ include "tech-radar.image" (dict "image" .Values.backend.image "root" $) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: {{ .Values.scheduler.command | toJson }}
          securityContext:
            {{- include "tech-radar.containerSecurityContext" (dict "root" $ "bilesen" .Values.scheduler) | nindent 12 }}
          {{- include "tech-radar.uygulamaOrtami" . | nindent 10 }}
