# Celery Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.worker.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tech-radar.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.worker.name }}
    app.kubernetes.io/component: {{ .Values.worker.component }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.worker.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.worker.name }}
        app.kubernetes.io/component: {{ .Values.worker.component }}
      annotations:
        {{- include "tech-radar.ayarOzeti" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "tech-radar.podSecurityContext" .Values.worker.securityContext | nindent 8 }}
      initContainers:
        {{- include "tech-radar.migrasyonBekle" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "tech-radar.image" (dict "image" .Values.backend.image "root" $) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: {{ .Values.worker.command | toJson }}
          securityContext:
            {{- include "tech-radar.containerSecurityContext" (dict "root" $ "bilesen" .Values.worker) | nindent 12 }}
          {{- include "tech-radar.uygulamaOrtami" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
---
# Celery Beat — her zaman 1 replica
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.scheduler.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tech-radar.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.scheduler.name }}
    app.kubernetes.io/component: {{ .Values.scheduler.component }}
spec:
  replicas: {{ .Values.scheduler.replicas }}
  strategy:
    type: {{ .Values.scheduler.strategy }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.scheduler.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.scheduler.name }}
        app.kubernetes.io/component: {{ .Values.scheduler.component }}
