# Hook degil: her revizyonda yeni adli Job (Job spec'i degistirilemez). api/worker/
# scheduler migrasyon-bekle initContainer'inda bunu bekler; helm --wait-for-jobs kilitlenmez.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.migration.name }}-r{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tech-radar.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.migration.name }}
    app.kubernetes.io/component: {{ .Values.migration.component }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.migration.name }}
        app.kubernetes.io/component: {{ .Values.migration.component }}
    spec:
      restartPolicy: {{ .Values.migration.restartPolicy }}
      securityContext:
        {{- include "tech-radar.podSecurityContext" .Values.migration.securityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "tech-radar.image" (dict "image" .Values.backend.image "root" $) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- include "tech-radar.containerSecurityContext" (dict "root" $ "bilesen" .Values.migration) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              echo "PostgreSQL bekleniyor ($DB_HOST:${DB_PORT:-5432})..."
              until nc -z "$DB_HOST" "${DB_PORT:-5432}" 2>/dev/null; do
                sleep 2
              done
              echo "Migration calistiriliyor..."
              python manage.py migrate --noinput
              echo "Migration tamamlandi."
          {{- include "tech-radar.uygulamaOrtami" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
