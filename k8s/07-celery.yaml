# ============================================
# Celery Worker — Arka plan gorev isleyicisi
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teknoloji-worker
  namespace: teknoloji-haberleri
  labels:
    app.kubernetes.io/name: teknoloji-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: teknoloji-haberleri
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teknoloji-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teknoloji-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: teknoloji-haberleri-api:latest
          command: ["celery", "-A", "cybernews", "worker", "-l", "info", "--concurrency=2"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: teknoloji-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: teknoloji-secret
                  key: SECRET_KEY
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: teknoloji-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teknoloji-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
---
# ============================================
# Celery Beat — Periyodik gorev zamanlayici
# ONEMLI: Beat her zaman 1 replica olmali!
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teknoloji-scheduler
  namespace: teknoloji-haberleri
  labels:
    app.kubernetes.io/name: teknoloji-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: teknoloji-haberleri
spec:
  replicas: 1
  strategy:
    type: Recreate  # Beat icin onemli — ayni anda 2 instance calismasini onler
  selector:
    matchLabels:
      app.kubernetes.io/name: teknoloji-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teknoloji-scheduler
        app.kubernetes.io/component: scheduler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: teknoloji-haberleri-api:latest
          # PersistentScheduler varsayilan olarak calisma dizinine (readOnlyRootFilesystem
          # altinda yazilamaz) celerybeat-schedule yazar; yazilabilir /tmp'e yonlendirildi.
          command: ["celery", "-A", "cybernews", "beat", "-l", "info", "--schedule=/tmp/celerybeat-schedule"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: teknoloji-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: teknoloji-secret
                  key: SECRET_KEY
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: teknoloji-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teknoloji-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
