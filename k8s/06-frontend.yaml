apiVersion: apps/v1
kind: Deployment
metadata:
  name: teknoloji-frontend
  namespace: teknoloji-haberleri
  labels:
    app.kubernetes.io/name: teknoloji-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: teknoloji-haberleri
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: teknoloji-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teknoloji-frontend
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: teknoloji-haberleri-frontend:latest
          # imagePullPolicy: Always  # Registry kullaniyorsaniz acin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-log
              mountPath: /var/log/nginx
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: teknoloji-frontend
  namespace: teknoloji-haberleri
  labels:
    app.kubernetes.io/name: teknoloji-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: teknoloji-haberleri
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: teknoloji-frontend
