# React arayuzunu sunan nginx icin guvenlik basliklari (2026-10-08). Django kendi
# basliklarini /api/, /admin/, /static/ yanitlarinda zaten verir; bu dosya YALNIZ
# SPA ve statik varlik location'larina include edilir (proxy'lenen yanitlara eklenmez,
# cift CSP olmaz). nginx'te add_header kalitimi: bir location kendi add_header'ini
# tanimlarsa ust blogunkileri almaz; o yuzden her ilgili location bu dosyayi acikca icerir.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Vite uretim ciktisi inline script icermez (type=module src); react-bootstrap inline stil kullanir.
# connect-src 'self': API ayni origin'den (/api/ proxy). Resim/font: data: URI'ler ikon kutuphanesi icin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
