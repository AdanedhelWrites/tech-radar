server {
    listen 3000;
    server_name _;
    # Surum bilgisi sizmasin (2026-10-08)
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ^~: bu oneklerle eslesen istekte asagidaki regex (cache) blogu denenmez; aksi halde /static/*.css proxy'lenmez (Faz B2 dogrulamasi)
    # API proxy — backend service'e yonlendir
    # Kubernetes'te service adi: teknoloji-api
    location ^~ /api/ {
        proxy_pass http://teknoloji-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Django admin proxy (opsiyonel)
    location ^~ /admin/ {
        proxy_pass http://teknoloji-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files proxy
    location ^~ /static/ {
        proxy_pass http://teknoloji-api:8000;
        proxy_set_header Host $host;
    }

    # SPA — tum diger route'lari index.html'e yonlendir
    location / {
        include /etc/nginx/snippets/guvenlik_basliklari.conf;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (add_header tanimladigi icin guvenlik basliklari burada da include edilir)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/guvenlik_basliklari.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
