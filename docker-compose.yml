services:
  # Django Backend API
  # Veritabani: yerel-platform reposundaki paylasilan PostgreSQL (yerel-postgres:5432, DB/kullanici cybernews)
  teknoloji-api:
    build: .
    image: teknoloji-haberleri-api:latest
    container_name: teknoloji-api
    user: root
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY .env icinde tanimli olmali (openssl rand -hex 32)}
      - ALLOWED_HOSTS=localhost,127.0.0.1,teknoloji-api
      - DB_HOST=yerel-postgres
      - DB_PORT=5432
      - DB_NAME=cybernews
      - DB_USER=cybernews
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env icinde tanimli olmali (yerel-platform/scripts/uygulama_ekle.sh cybernews)}
      - REDIS_URL=redis://teknoloji-redis:6379/0
      - CELERY_BROKER_URL=redis://teknoloji-redis:6379/1
      - LIBRETRANSLATE_URL=http://teknoloji-translate:5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RETENTION_DAYS=90
      - GEMINI_CVE_RESERVE=0.5
    depends_on:
      teknoloji-redis:
        condition: service_started
    volumes:
      - ./:/app
    restart: unless-stopped
    networks:
      - teknoloji-network
      - yerel-platform

  # React Frontend (Vite Dev Server)
  teknoloji-frontend:
    image: node:22-alpine
    container_name: teknoloji-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - teknoloji-api
    restart: unless-stopped
    networks:
      - teknoloji-network

  # LibreTranslate (cekim aninda tek ceviri saglayicisi; Gemini yalniz retranslate'te)
  teknoloji-translate:
    image: libretranslate/libretranslate:v1.9.6
    container_name: teknoloji-translate
    environment:
      - LT_LOAD_ONLY=en,tr
      - LT_UPDATE_MODELS=false
    volumes:
      # Modeller imajda yok, ilk acilista iner (258 MB). Volume olmazsa her
      # yeniden olusturmada tekrar iner ve internet yoksa servis acilmaz.
      - teknoloji-translate-models:/home/libretranslate/.local
    # Denemede yuk altinda 12 cekirdegin tamamini doyurdu; diger servisleri ac birakmasin
    cpus: '4'
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - teknoloji-network

  # Redis Cache & Message Broker
  teknoloji-redis:
    image: redis:7-alpine
    container_name: teknoloji-redis
    ports:
      - "6379:6379"
    volumes:
      - teknoloji-redis-data:/data
    restart: unless-stopped
    networks:
      - teknoloji-network

  # Celery Worker (Arka Plan Görev İşleyici)
  teknoloji-worker:
    build: .
    image: teknoloji-haberleri-api:latest
    container_name: teknoloji-worker
    user: root
    command: celery -A cybernews worker -l info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY .env icinde tanimli olmali (openssl rand -hex 32)}
      - ALLOWED_HOSTS=localhost,127.0.0.1,teknoloji-api
      - DB_HOST=yerel-postgres
      - DB_PORT=5432
      - DB_NAME=cybernews
      - DB_USER=cybernews
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env icinde tanimli olmali (yerel-platform/scripts/uygulama_ekle.sh cybernews)}
      - REDIS_URL=redis://teknoloji-redis:6379/0
      - CELERY_BROKER_URL=redis://teknoloji-redis:6379/1
      - LIBRETRANSLATE_URL=http://teknoloji-translate:5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RETENTION_DAYS=90
      - GEMINI_CVE_RESERVE=0.5
    depends_on:
      teknoloji-redis:
        condition: service_started
      teknoloji-api:
        condition: service_started
    volumes:
      - ./:/app
    restart: unless-stopped
    networks:
      - teknoloji-network
      - yerel-platform

  # Celery Beat Scheduler (Zamanlayıcı)
  teknoloji-scheduler:
    build: .
    image: teknoloji-haberleri-api:latest
    container_name: teknoloji-scheduler
    user: root
    command: celery -A cybernews beat -l info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY .env icinde tanimli olmali (openssl rand -hex 32)}
      - ALLOWED_HOSTS=localhost,127.0.0.1,teknoloji-api
      - DB_HOST=yerel-postgres
      - DB_PORT=5432
      - DB_NAME=cybernews
      - DB_USER=cybernews
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env icinde tanimli olmali (yerel-platform/scripts/uygulama_ekle.sh cybernews)}
      - REDIS_URL=redis://teknoloji-redis:6379/0
      - CELERY_BROKER_URL=redis://teknoloji-redis:6379/1
    depends_on:
      teknoloji-redis:
        condition: service_started
      teknoloji-api:
        condition: service_started
    volumes:
      - ./:/app
    restart: unless-stopped
    networks:
      - teknoloji-network
      - yerel-platform

volumes:
  teknoloji-redis-data:
  teknoloji-translate-models:

networks:
  teknoloji-network:
    driver: bridge
  # Paylasilan yerel PostgreSQL (ayri repo: yerel-platform). Once orada `docker compose up -d`.
  yerel-platform:
    external: true
