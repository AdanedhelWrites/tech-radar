# Surum guncellemeleri. Guvenlik guncellemeleri (Dependabot security updates) bundan bagimsiz, aninda acilir.
# cooldown: yeni cikan surumu 7 gun bekletir; ele gecirilmis bir release'in hemen hatta girmesini onler.
# github-actions: workflow'lardaki SHA pin'lerini guncel tutar.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories: ["/", "/frontend"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
