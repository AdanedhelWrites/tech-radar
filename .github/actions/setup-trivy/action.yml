name: Setup Trivy (checksum dogrulamali)
description: >
  Trivy binary'sini sabit surum + sabit SHA256 ile kurar, zafiyet DB'sini indirir
  ve DB tazeligini dogrular. trivy-action / setup-trivy kullanilmiyor: Mart 2026'da
  bu action'larin tag'leri ele gecirildi; binary checksum'i repoda sabit tutulunca
  upstream'deki bir degisiklik hatti sessizce degil, kirmizi olarak durdurur.

inputs:
  version:
    description: Trivy surumu (v oneki olmadan)
    default: "0.74.0"
  sha256:
    description: trivy_<version>_Linux-64bit.tar.gz icin resmi checksums.txt degeri
    default: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
  max-db-age-hours:
    description: Bu saatten eski zafiyet DB'si ile tarama yapilmaz (bayat DB = haksiz yesil)
    default: "72"

runs:
  using: composite
  steps:
    - name: Trivy binary'sini indir ve checksum dogrula
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.version }}
        TRIVY_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
        echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
        tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" trivy
        # GITHUB_PATH'e yazmak yerine sabit konuma kur (zizmor: github-env)
        sudo install -m 0755 "${RUNNER_TEMP}/trivy" /usr/local/bin/trivy
        trivy --version

    - name: Zafiyet DB'sini indir ve tazeligini dogrula
      shell: bash
      env:
        MAX_DB_AGE_HOURS: ${{ inputs.max-db-age-hours }}
      run: |
        set -euo pipefail
        trivy image --download-db-only --no-progress
        updated=$(trivy version --format json | jq -r '.VulnerabilityDB.UpdatedAt // empty')
        if [ -z "${updated}" ]; then
          echo "::error::Trivy DB meta verisi okunamadi; DB olmadan tarama yesil gecmemeli."
          exit 1
        fi
        updated_epoch=$(jq -rn --arg t "${updated}" '$t | sub("\\.[0-9]+"; "") | fromdateiso8601')
        age_hours=$(( ( $(date +%s) - updated_epoch ) / 3600 ))
        echo "Trivy DB UpdatedAt=${updated} (yas: ${age_hours} saat, sinir: ${MAX_DB_AGE_HOURS})"
        if [ "${age_hours}" -gt "${MAX_DB_AGE_HOURS}" ]; then
          echo "::error::Trivy DB ${age_hours} saatlik; bayat DB ile tarama yapilmiyor."
          exit 1
        fi
