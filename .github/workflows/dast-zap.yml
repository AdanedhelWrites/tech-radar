# DAST: OWASP ZAP baseline (pasif, blackbox) — SOOS DAST'in yerine, ucretsiz.
# Uygulama CI icinde ayaga kaldirilir (backend imaji + redis + postgresql), ZAP localhost'u tarar.
# Hedef: backend kokunde sayfa yok (/ -> 404); HTML yuzeyi admin login (baseline). /api/v1/ ise
# manage.py spectacular semasiyla, gecici token'li zaproxy/action-api-scan ile taranir (P5-c).
#
# Mod: RAPOR. Bulgular hatti durdurmaz; HTML/JSON/MD rapor artefakt olarak saklanir ve JSON
# rapor SARIF'e cevrilip Security -> Code scanning'e (kategori zap-baseline; API taramasi zap-api) yuklenir (P5):
# tek kontrol yeri Security sekmesidir. scripts/zap_sarif.py yalniz standart kutuphane kullanir.
# Gurultu kurallari .zap/rules.tsv ile IGNORE edilir: ZAP ozetinde sayilmaz, SARIF'e cevrilirken atlanir.
# Uygulama ayaga kalkmazsa veya ZAP hedefi gormezse job kirmizidir (bos hedefe yesil tarama yok).

name: DAST (ZAP baseline)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # SARIF yukleme (Security -> Code scanning)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Backend imajini derle
        run: docker build -t tech-radar-api:dast .

      - name: Uygulamayi ayaga kaldir
        run: |
          set -euo pipefail
          docker network create dast
          docker run -d --name redis --network dast redis:7-alpine
          # Faz B1: DEBUG=False iken DB_HOST zorunlu (SQLite'a dusulmez); tek kullanimlik PostgreSQL
          docker run -d --name postgres --network dast \
            -e POSTGRES_USER=cybernews -e POSTGRES_PASSWORD=dast-gecici -e POSTGRES_DB=cybernews \
            postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          # -h 127.0.0.1: ilk acilistaki gecici sunucu yalniz unix soketini dinler
          for _ in $(seq 1 60); do
            docker exec postgres pg_isready -h 127.0.0.1 -U cybernews -d cybernews >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec postgres pg_isready -h 127.0.0.1 -U cybernews -d cybernews
          docker run -d --name api --network dast -p 127.0.0.1:8000:8000 \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DB_HOST=postgres -e DB_NAME=cybernews -e DB_USER=cybernews -e DB_PASSWORD=dast-gecici \
            -e REDIS_URL=redis://redis:6379/0 \
            -e CELERY_BROKER_URL=redis://redis:6379/1 \
            -e V1_THROTTLE_READ=100000/min -e V1_THROTTLE_REFRESH=100000/hour \
            tech-radar-api:dast

      - name: Uygulama gercekten ayakta mi
        run: |
          set -euo pipefail
          # entrypoint.sh sirayla redis bekler, migrate + collectstatic calistirir,
          # sonra gunicorn'u baslatir — port bu asamalar bitene kadar hic acilmaz.
          # CI runner'i sogukken migrate+collectstatic 90 sn'yi asabiliyor (gozlemlendi:
          # 12:20 UTC kosusunda 12:22'de migration'lar halen suruyordu). Sure, bu
          # asamalarin makul en kotu durumda bitecegi kadar (5 dk) genisletildi;
          # gercek kapi yine /api/v1/health/ 200'u, sabit bir uyku degil.
          timeout_s=300
          interval_s=3
          elapsed=0
          code=""
          while [ "${elapsed}" -lt "${timeout_s}" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health/ || true)
            if [ "${code}" = "200" ]; then
              echo "API hazir (/api/v1/health/ HTTP 200, ${elapsed} sn'de)"
              exit 0
            fi
            sleep "${interval_s}"
            elapsed=$((elapsed + interval_s))
          done
          echo "::error::API ${timeout_s} sn icinde HTTP 200 donmedi (son kod: ${code}); tarama yapilmadan yesil gecilmez."
          docker logs api
          exit 1

      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8000/admin/login/
          cmd_options: "-a"
          rules_file_name: .zap/rules.tsv   # IGNORE: gurultu kurallari (bkz. dosya)
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline

      - name: ZAP hedefi gercekten taradi mi
        run: |
          set -euo pipefail
          test -s report_json.json || { echo "::error::ZAP JSON raporu yok"; exit 1; }
          sites=$(jq '[.site[]? | select(."@name" | test("localhost"))] | length' report_json.json)
          [ "${sites}" -ge 1 ] || { echo "::error::ZAP raporunda localhost hedefi yok"; exit 1; }
          {
            echo "### ZAP baseline"
            echo "| Risk | Alert tipi |"
            echo "|---|---|"
            jq -r '[.site[].alerts[]? | .riskdesc | split(" ")[0]] | group_by(.)[] | "| \(.[0]) | \(length) |"' report_json.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: SARIF'e cevir
        run: |
          set -euo pipefail
          # --kurallar: .zap/rules.tsv IGNORE eklentileri SARIF'e girmez (ZAP JSON raporu onlari yine tasir)
          python3 scripts/zap_sarif.py report_json.json zap-baseline.sarif --kurallar .zap/rules.tsv
          # Gecersiz JSON ile Security sekmesine bos bir kosu dusmesin
          python3 -c 'import json,sys; d=json.load(open("zap-baseline.sarif")); assert d["version"]=="2.1.0" and d["runs"], "SARIF iskeleti bozuk"'

      - name: SARIF yukle
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: zap-baseline.sarif
          category: zap-baseline

      # ---- P5-c: /api/v1/ OpenAPI tabanli, token'li API taramasi (rapor modu; kategori zap-api) ----
      - name: v1 semasi ve gecici token
        run: |
          set -euo pipefail
          docker exec api python manage.py spectacular --file /tmp/schema.yml
          docker cp api:/tmp/schema.yml schema.yml
          test -s schema.yml
          # Django 5.2 shell -c banner basar: -v 0 + tail -1
          token=$(docker exec api python manage.py shell -v 0 -c "from django.contrib.auth.models import User; from rest_framework.authtoken.models import Token; u, _ = User.objects.get_or_create(username='zap-dast'); print(Token.objects.get_or_create(user=u)[0].key)" | tail -1)
          [ "${#token}" -ge 20 ] || { echo "::error::token uretilemedi"; exit 1; }
          echo "::add-mask::${token}"
          printf '%s' "${token}" > .zap/api-token.txt
          # Token gercekten calisiyor mu: kanca bozulsa bile 401'li tarama "yesil" gorunmesin
          curl -fsS -o /dev/null -H "Authorization: Token ${token}" http://localhost:8000/api/v1/status/
          # Baseline raporu API taramasinin raporu sanilmasin
          rm -f report_json.json report_html.html report_md.md

      - name: ZAP API taramasi (/api/v1/)
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: schema.yml
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: "-O http://localhost:8000 --hook=/zap/wrk/.zap/api_hooks.py -a"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-api

      - name: ZAP API hedefi gercekten taradi mi
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -f .zap/api-token.txt
          test -s report_json.json || { echo "::error::ZAP API JSON raporu yok"; exit 1; }
          # IGNORE'd pasif uyarilar da JSON'da yer alir; temiz bir API bile /api/v1/ adresleri uretir
          adres=$(jq '[.site[]? | select(."@name" | test("localhost")) | .alerts[]?.instances[]?.uri | select(test("/api/v1/"))] | length' report_json.json)
          [ "${adres}" -ge 1 ] || { echo "::error::ZAP API raporunda /api/v1/ adresi yok (token ya da sema sorunu); bos hedefe yesil yok"; exit 1; }
          {
            echo "### ZAP API (/api/v1/)"
            echo "| Risk | Alert tipi |"
            echo "|---|---|"
            jq -r '[.site[].alerts[]? | .riskdesc | split(" ")[0]] | group_by(.)[] | "| \(.[0]) | \(length) |"' report_json.json
          } >> "${GITHUB_STEP_SUMMARY}"
          python3 scripts/zap_sarif.py report_json.json zap-api.sarif --kurallar .zap/rules.tsv
          python3 -c 'import json; d=json.load(open("zap-api.sarif")); assert d["version"]=="2.1.0" and d["runs"], "SARIF iskeleti bozuk"'

      - name: API SARIF yukle
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: zap-api.sarif
          category: zap-api

      - name: API loglari
        if: ${{ always() }}
        run: docker logs api 2>&1 | tail -n 100
