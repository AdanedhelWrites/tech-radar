# zizmor: GitHub Actions workflow'larinin guvenlik denetimi
# (template injection, fazla GITHUB_TOKEN yetkisi, pinlenmemis action, credential sizintisi...).
# Haftalik kosu, bilinen-zafiyetli action surumlerini (online audit) yakalar.

name: zizmor

on:
  push:
    branches: ["main"]
    paths: [".github/**"]
  pull_request:
    branches: ["main"]
    paths: [".github/**"]
  schedule:
    - cron: "5 4 * * 4"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.30.1"
          advanced-security: true
