# Proje sagligi: backend testleri, migration tutarliligi, frontend build, Helm/compose dogrulamasi.
# Bu hat KAPI'dir: kirmiziysa merge edilmemeli.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django testleri)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: cybernews
          POSTGRES_PASSWORD: ci-gecici-test
          POSTGRES_DB: cybernews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cybernews -d cybernews"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DEBUG: "False"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      # Faz B1: testler PostgreSQL'de kosar; DEBUG=False iken DB_HOST zorunludur
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: cybernews
      DB_USER: cybernews
      DB_PASSWORD: ci-gecici-test
      # Test suite'i bu sayinin altina duserse test kesfi bozulmus demektir
      # (ornegin import hatasi yuzunden modul atlanmasi). Test silindiginde guncelle.
      MIN_TESTS: "100"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bagimliliklar
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: |
          SECRET_KEY="$(openssl rand -hex 32)" python manage.py check

      - name: Eksik migration var mi
        run: |
          SECRET_KEY="$(openssl rand -hex 32)" python manage.py makemigrations --check --dry-run

      - name: Testler
        run: |
          set -o pipefail
          SECRET_KEY="$(openssl rand -hex 32)" python manage.py test --noinput 2>&1 | tee test.log
          ran=$(grep -oE '^Ran [0-9]+ test' test.log | grep -oE '[0-9]+' | tail -1)
          ran=${ran:-0}
          echo "### Backend: ${ran} test calisti" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${ran}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Yalnizca ${ran} test calisti (beklenen >= ${MIN_TESTS}); test kesfi bozuk olabilir."
            exit 1
          fi

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bagimliliklar (lockfile'a birebir)
        run: npm ci --no-audit --no-fund

      - name: Build
        run: |
          npm run build
          test -s dist/index.html || { echo "::error::dist/index.html uretilmedi"; exit 1; }

  manifests:
    name: Helm / Compose dogrulama
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: helm lint + template
        run: |
          set -euo pipefail
          # secrets.secretKey bilincli olarak bos ve `required`; CI sahte deger verir
          helm lint helm/tech-radar --set secrets.secretKey=ci-dogrulama-icin-sahte-deger
          helm template tech-radar helm/tech-radar --set secrets.secretKey=ci-dogrulama-icin-sahte-deger > rendered.yaml
          kinds=$(grep -cE '^kind:' rendered.yaml || true)
          echo "Helm render: ${kinds} kaynak"
          [ "${kinds}" -ge 5 ] || { echo "::error::Helm chart beklenenden az kaynak uretti (${kinds})"; exit 1; }

      - name: docker compose config
        # SECRET_KEY ve DB_PASSWORD compose'da :? ile zorunlu; CI sahte deger verir
        run: SECRET_KEY=ci-dogrulama-icin-sahte-deger DB_PASSWORD=ci-dogrulama-icin-sahte-parola docker compose -f docker-compose.yml config --quiet
