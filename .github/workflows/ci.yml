# Proje sagligi: backend testleri, migration tutarliligi, frontend build, Helm/compose dogrulamasi.
# Bu hat KAPI'dir: kirmiziysa merge edilmemeli.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django testleri)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: cybernews
          POSTGRES_PASSWORD: ci-gecici-test
          POSTGRES_DB: cybernews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cybernews -d cybernews"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DEBUG: "False"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      # Faz B1: testler PostgreSQL'de kosar; DEBUG=False iken DB_HOST zorunludur
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: cybernews
      DB_USER: cybernews
      DB_PASSWORD: ci-gecici-test
      # Test suite'i bu sayinin altina duserse test kesfi bozulmus demektir
      # (ornegin import hatasi yuzunden modul atlanmasi). Test silindiginde guncelle.
      MIN_TESTS: "100"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bagimliliklar
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: |
          SECRET_KEY="$(openssl rand -hex 32)" python manage.py check

      - name: Eksik migration var mi
        run: |
          SECRET_KEY="$(openssl rand -hex 32)" python manage.py makemigrations --check --dry-run

      - name: Testler
        run: |
          set -o pipefail
          SECRET_KEY="$(openssl rand -hex 32)" python manage.py test --noinput 2>&1 | tee test.log
          ran=$(grep -oE '^Ran [0-9]+ test' test.log | grep -oE '[0-9]+' | tail -1)
          ran=${ran:-0}
          echo "### Backend: ${ran} test calisti" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${ran}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Yalnizca ${ran} test calisti (beklenen >= ${MIN_TESTS}); test kesfi bozuk olabilir."
            exit 1
          fi

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bagimliliklar (lockfile'a birebir)
        run: npm ci --no-audit --no-fund

      - name: Build
        run: |
          npm run build
          test -s dist/index.html || { echo "::error::dist/index.html uretilmedi"; exit 1; }

  manifests:
    name: Helm / Compose dogrulama
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # secrets.* bilincli olarak bos ve `required`; CI sahte deger verir
      HELM_GEREKLI: --set secrets.secretKey=ci-dogrulama-icin-sahte-deger --set secrets.dbPassword=ci-dogrulama-icin-sahte-parola
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Chart surum kapisi taban commit'teki Chart.yaml'a erisir
          fetch-depth: 0

      - name: helm lint + template
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          helm lint helm/tech-radar $HELM_GEREKLI
          # shellcheck disable=SC2086
          helm template tech-radar helm/tech-radar -n tech-radar-ci $HELM_GEREKLI > rendered.yaml
          # shellcheck disable=SC2086
          helm template tech-radar helm/tech-radar -n tech-radar-ci $HELM_GEREKLI -f helm/tech-radar/ci/yerel-values.yaml > rendered-yerel.yaml
          # B3: Argo CD + VSO kurulumu sir degeri vermeden render edilmeli
          helm lint helm/tech-radar -f helm/tech-radar/ci/argocd-values.yaml
          helm template tech-radar helm/tech-radar -n tech-radar-ci -f helm/tech-radar/ci/argocd-values.yaml > rendered-argocd.yaml
          kinds=$(grep -cE '^kind:' rendered.yaml || true)
          echo "### Helm render: ${kinds} kaynak" >> "${GITHUB_STEP_SUMMARY}"
          [ "${kinds}" -eq 18 ] || { echo "::error::Helm chart 18 kaynak bekleniyordu, ${kinds} uretti"; exit 1; }

      - name: Zorunlu degerler (negatif test)
        run: |
          set -uo pipefail
          if helm template t helm/tech-radar --set secrets.secretKey=x > /dev/null 2> hata.txt; then
            echo "::error::secrets.dbPassword olmadan render basarili oldu"; exit 1
          fi
          grep -q "secrets.dbPassword zorunlu" hata.txt || { cat hata.txt; exit 1; }
          if helm template t helm/tech-radar --set secrets.dbPassword=x > /dev/null 2> hata.txt; then
            echo "::error::secrets.secretKey olmadan render basarili oldu"; exit 1
          fi
          grep -q "secrets.secretKey zorunlu" hata.txt || { cat hata.txt; exit 1; }

      - name: Render cikti kontrolleri
        run: |
          set -euo pipefail
          if grep -nE 'ALLOWED_HOSTS: "\*"|postgresPassword|DATABASE_URL' rendered.yaml; then
            echo "::error::Render'da kaldirilmis ya da yasak ayar var"; exit 1
          fi
          grep -q 'name: teknoloji-translate$' rendered.yaml || { echo "::error::LibreTranslate Deployment'i yok"; exit 1; }
          scripts/imaj_etiket_kontrol.sh rendered.yaml
          scripts/imaj_etiket_kontrol.sh rendered-yerel.yaml

      - name: Argo CD modu (migration.mode=argocd, secrets.existingSecret)
        run: |
          set -euo pipefail
          kinds=$(grep -cE '^kind:' rendered-argocd.yaml || true)
          echo "### Helm render (argocd modu): ${kinds} kaynak" >> "${GITHUB_STEP_SUMMARY}"
          [ "${kinds}" -eq 14 ] || { echo "::error::argocd render'i 14 kaynak bekleniyordu, ${kinds} uretti"; exit 1; }
          if grep -q '^kind: Secret' rendered-argocd.yaml; then
            echo "::error::secrets.existingSecret varken chart Secret uretti"; exit 1
          fi
          if grep -q 'checksum/secret' rendered-argocd.yaml; then
            echo "::error::secrets.existingSecret varken checksum/secret yazildi"; exit 1
          fi
          if grep -A1 'secretKeyRef:' rendered-argocd.yaml | grep 'name:' | grep -qv 'name: teknoloji-secret$'; then
            echo "::error::secretKeyRef existingSecret'i kullanmiyor"; exit 1
          fi
          sed -n '/^kind: Job$/,/^spec:$/p' rendered-argocd.yaml > job-argocd.txt
          grep -q '^  name: teknoloji-migrate$' job-argocd.txt || { echo "::error::argocd modunda Job adi sabit degil"; exit 1; }
          grep -q 'argocd.argoproj.io/hook: Sync$' job-argocd.txt || { echo "::error::Sync hook annotation'i yok"; exit 1; }
          grep -q 'argocd.argoproj.io/hook-delete-policy: BeforeHookCreation$' job-argocd.txt \
            || { echo "::error::BeforeHookCreation annotation'i yok"; exit 1; }
          sed -n '/^kind: Job$/,/^spec:$/p' rendered.yaml > job-helm.txt
          grep -q '^  name: teknoloji-migrate-r1$' job-helm.txt || { echo "::error::helm modunda Job adi <name>-r<revizyon> degil"; exit 1; }
          if grep -q 'argocd.argoproj.io/hook' job-helm.txt; then echo "::error::helm modunda Argo hook annotation'i var"; exit 1; fi
          # shellcheck disable=SC2086
          if helm template t helm/tech-radar --set migration.mode=yanlis $HELM_GEREKLI > /dev/null 2> hata.txt; then
            echo "::error::gecersiz migration.mode kabul edildi"; exit 1
          fi
          grep -q "migration.mode 'helm' ya da 'argocd' olmali" hata.txt || { cat hata.txt; exit 1; }
          scripts/imaj_etiket_kontrol.sh rendered-argocd.yaml

      - name: kubeconform (Kubernetes semasi)
        run: |
          docker run --rm -v "$PWD:/w" \
            ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary -kubernetes-version 1.31.0 /w/rendered.yaml /w/rendered-yerel.yaml /w/rendered-argocd.yaml

      - name: Chart surum kapisi
        env:
          TABAN: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: scripts/chart_surum_kontrol.sh "$TABAN"

      - name: docker compose config
        # SECRET_KEY ve DB_PASSWORD compose'da `:?` ile zorunlu; CI sahte deger verir
        run: SECRET_KEY=ci-dogrulama-icin-sahte-deger DB_PASSWORD=ci-dogrulama-icin-sahte-parola docker compose -f docker-compose.yml config --quiet
